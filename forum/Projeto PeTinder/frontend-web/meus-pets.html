    <div id="modalCadastro" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Novo Pet</h2>
                <button class="close-btn" onclick="fecharModalCadastro()">&times;</button>
            </div>
            <form id="petForm" onsubmit="salvarPet(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nome do Pet</label>
                        <input type="text" id="nome" required placeholder="Ex: Thor">
                    </div>
                    <div class="form-group">
                        <label>Espécie</label>
                        <select id="especie">
                            <option value="Cão">Cão</option>
                            <option value="Gato">Gato</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Porte</label>
                        <select id="porte">
                            <option value="Pequeno">Pequeno</option>
                            <option value="Médio">Médio</option>
                            <option value="Grande">Grande / Gigante</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Link da Foto (URL)</label>
                        <input type="url" id="foto" placeholder="https://imagem-do-pet.jpg">
                    </div>
                    <button type="submit" class="btn-pill-main" style="width:100%">Finalizar Cadastro</button>
                </div>
            </form>
        </div>
    </div>

<script>
    // Unificando a função de abrir: agora ela usa a classe 'active' que definimos no CSS
    function abrirModalCadastro() {
        const modal = document.getElementById('modalCadastro');
        if (modal) {
            modal.classList.add('active');
        }
    }

    // Unificando a função de fechar
    function fecharModalCadastro() {
        const modal = document.getElementById('modalCadastro');
        if (modal) {
            modal.classList.remove('active');
        }
    }

    function salvarPet(event) {
        event.preventDefault();
        
        // Pegar valores dos inputs
        const nome = document.getElementById('nome').value;
        const especie = document.getElementById('especie').value;
        const porte = document.getElementById('porte').value;
        
        // Link de foto reserva caso o usuário não mande um (usando o Cataas que funciona!)
        const fotoPadrao = `https://cataas.com/cat?width=400&height=300&random=${Math.random()}`;
        const foto = document.getElementById('foto').value || fotoPadrao;

        // Selecionar a grid
        const grid = document.getElementById('meusPetsGrid');
        if (!grid) {
            console.error("Grid 'meusPetsGrid' não encontrada!");
            return;
        }

        // Criar o card com as classes do nosso CSS moderno
        const novoCard = document.createElement('div');
        novoCard.className = 'pet-card';
        novoCard.innerHTML = `
            <img src="${foto}" class="pet-image" alt="${nome}">
            <div class="pet-info">
                <div>
                    <h3>${nome}</h3>
                    <p>${especie} • ${porte}</p>
                </div>
                <div class="pet-actions">
                    <button class="btn-edit" onclick="alert('Editar ${nome}')">Editar Perfil</button>
                    <button class="btn-delete" onclick="this.closest('.pet-card').remove()">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;

        // Adicionar o novo card antes do botão de "Adicionar Novo"
        // (Assume-se que o botão de adicionar é o último elemento da grid)
        const botaoAdicionar = grid.querySelector('.add-pet-card');
        if (botaoAdicionar) {
            grid.insertBefore(novoCard, botaoAdicionar);
        } else {
            grid.appendChild(novoCard);
        }

        // Fechar modal e limpar formulário
        fecharModalCadastro();
        document.getElementById('petForm').reset();
    }
</script>


    <script>
        async function deletarPet(id) {
    if (!confirm("Tem certeza que deseja remover este pet?")) return;

    try {
        const response = await fetch(`http://localhost:3000/pets/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            // Recarrega a lista para sumir o card
            carregarPets(); 
        } else {
            alert("Erro ao deletar o pet.");
        }
    } catch (error) {
        console.error("Erro na requisição:", error);
    }
}
    </script>
